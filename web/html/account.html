<!DOCTYPE html>
<html lang="en">
	<head>
		{{template "head" .}}
		<script src="scripts/account.js" type="module"></script>
		<link rel="modulepreload" href="scripts/utils.js">
		<link rel="modulepreload" href="scripts/dialog.js">
		<style>
			@media screen and (width >= 1264px){
				.resource-container {
					display: grid;
					grid-template-columns: repeat(auto-fill, calc(100% / 6));
					grid-gap: 0;
					justify-content: space-between;
				}
			}
			@media screen and (width <= 1264px) and (width >= 680px) {
				.resource-container {
					display: grid;
					grid-template-columns: repeat(auto-fill, 200px);
					grid-gap: 0;
					justify-content: space-between;
				}
			}
			@media screen and (width <= 680px) {
				.resource-container {
					display: flex;
					flex-direction: column;
					gap: 0;
					flex-wrap: nowrap;
					justify-content: center;
				}
			}
		</style>
	</head>
	<body>
		{{template "header" .}}
		<main>
			<h2>Account</h2>
			<section class="w3-card w3-padding">
				<h3>Account Details</h3>
				<p id="username">Username: {{.user.Username.UserID}}@{{.user.Username.Realm}}</p>
				<p id="email">Email: {{.user.Mail}}</p>
				<p>Password: <button class="w3-button" id="change-password" type="button" style="padding: 0em; height: 1.5em; line-height: 1.5em;">Change Password</button></p>
			</section>
			{{range $poolname, $pool := .pools}}
				{{template "pool-resources" $pool}}
			{{end}}
		</main>
		<template id="change-password-dialog">
			<link rel="stylesheet" href="modules/w3.css">
			<link rel="stylesheet" href="css/style.css">
			<link rel="stylesheet" href="css/form.css">
			<dialog class="w3-container w3-card w3-border-0">
				<p class="w3-large" id="prompt">
					Change Password
				</p>
				<div id="body">
					<form method="dialog" class="input-grid" style="grid-template-columns: auto 1fr;" id="form">
						<label for="new-password">New Password</label>
						<input class="w3-input w3-border" id="new-password" name="new-password" type="password" required>
						<label for="confirm-password">Confirm Password</label>
						<input class="w3-input w3-border" id="confirm-password" name="confirm-password" type="password" required>
					</form>
				</div>
				<div id="controls" class="w3-center w3-container">
					<button id="cancel" type="submit" value="cancel" form="form" class="w3-button w3-margin"  formnovalidate>CANCEL</button>
					<button id="confirm" type="submit" value="confirm" form="form" class="w3-button w3-margin" >CONFIRM</button>
				</div>
			</dialog>
		</template>
	</body>
</html>
